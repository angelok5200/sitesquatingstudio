# Server Configuration
server.port=8082

# Spring Application
spring.application.name=site-squating

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:sitesquatting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Monitored Target Configuration Defaults
squating.default-brand=sparda-bank.de
squating.default-scan-interval-hours=168
squating.http-timeout-ms=5000
squating.monitored-tlds=.de,.com,.at,.ch,.net,.info
squating.auto-scan-on-startup=true
